name: 功能建议
description: 提议明确场景下的新能力或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明要解决的问题、目标用户和当前阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、边界和验收方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明考虑过的替代方案及其取舍。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复建议。
          required: true
        - label: 若涉及需求变更，我会说明与冻结 V1.0 需求的关系。
          required: true
